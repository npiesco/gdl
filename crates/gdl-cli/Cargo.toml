[package]
name = "gdl-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "gdl CLI binary — thin facade over gdl-core + gdl-format"

[[bin]]
name = "gdl"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
gdl-testkit = { path = "../gdl-testkit" }

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
gdl-core = { version = "0.1.0", path = "../gdl-core" }
gdl-format = { version = "0.1.0", path = "../gdl-format" }
