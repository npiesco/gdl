[package]
name = "gdl-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "gdl MCP stdio server — thin facade over gdl-core + gdl-format"

[[bin]]
name = "gdl-mcp"
path = "src/main.rs"

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
gdl-testkit = { path = "../gdl-testkit" }
serde_json = "1.0.150"

[dependencies]
gdl-core = { version = "0.1.0", path = "../gdl-core" }
gdl-format = { version = "0.1.0", path = "../gdl-format" }
rmcp = { version = "=3.1.4", features = ["transport-io"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
